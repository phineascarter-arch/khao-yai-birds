<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>考艾鳥類全名錄 2026/4-7 · Khao Yai Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,500;1,500;1,600&family=LXGW+WenKai+TC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --forest-deep:#0c1c14;
    --forest-mid:#152b1e;
    --canopy:#20402a;
    --canopy-line: rgba(207,159,63,0.18);
    --mist:#eef1e4;
    --text-soft:#c7d2bd;
    --text-dim:#8a9784;
    --ivory:#ecdcb2;
    --gold:#cf9f3f;
    --gold-bright:#e8c468;
    --lock-gray:#5a6559;
    --shadow: 0 18px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--forest-deep);
    color:var(--mist);
    font-family:'LXGW WenKai TC', serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .latin{font-family:'EB Garamond', serif; font-style:italic; color:var(--gold-bright);}
  a{color:inherit;}
  button{font-family:'LXGW WenKai TC'; cursor:pointer;}

  .hero{
    position:relative;
    height:clamp(240px, 32vw, 340px);
    overflow:hidden;
    background:linear-gradient(180deg, #0a1712 0%, #14281b 55%, var(--forest-deep) 100%);
    border-bottom:1px solid var(--canopy-line);
  }
  .hero svg.ridge{position:absolute; bottom:0; left:0; width:100%; height:auto; display:block;}
  .hero-content{
    position:relative; z-index:5;
    max-width:900px; margin:0 auto; padding:clamp(36px,6vw,56px) 24px 0;
    text-align:center;
  }
  .eyebrow{
    font-family:'Spectral', serif; font-style:italic; font-weight:500;
    letter-spacing:0.28em; text-transform:uppercase;
    color:var(--gold); font-size:0.72rem;
    display:inline-flex; align-items:center; gap:10px;
  }
  .eyebrow::before,.eyebrow::after{content:""; width:26px; height:1px; background:var(--gold); opacity:0.6;}
  h1.title{
    font-size:clamp(1.9rem, 5vw, 2.7rem);
    font-weight:700; margin:14px 0 4px;
    color:var(--ivory); letter-spacing:0.02em;
  }
  .title small{
    display:block; font-family:'EB Garamond', serif; font-style:italic;
    font-size:0.42em; color:var(--gold-bright); font-weight:500; margin-top:6px;
  }
  .subtitle{color:var(--text-soft); font-size:0.92rem; max-width:480px; margin:10px auto 0;}

  .dash-wrap{max-width:900px; margin:-28px auto 0; padding:0 24px; position:relative; z-index:6;}
  .dash-card{
    background:var(--forest-mid); border:1px solid var(--canopy-line); border-radius:14px;
    padding:18px 24px; box-shadow:var(--shadow);
  }
  .dash{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:14px;
  }
  .dash-item{text-align:center;}
  .dash-num{font-family:'Spectral'; font-weight:700; font-size:1.6rem; color:var(--gold-bright); line-height:1.1;}
  .dash-label{font-size:0.68rem; color:var(--text-dim); letter-spacing:0.04em; margin-top:4px;}
  .progress-track{grid-column:1/-1; height:8px; background:rgba(255,255,255,0.06); border-radius:99px; overflow:hidden; margin-top:2px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); border-radius:99px; transition:width .5s ease;}
  .unlock-note{
    grid-column:1/-1; font-size:0.76rem; color:var(--text-dim); text-align:center;
    border-top:1px solid var(--canopy-line); padding-top:10px; margin-top:2px;
  }
  .unlock-note b{color:var(--gold-bright); font-weight:600;}

  .sync-bar{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--canopy-line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  #sync-status{font-size:0.76rem; color:var(--text-dim);}
  .sync-btn{
    background:transparent; border:1px solid var(--gold); border-radius:8px;
    color:var(--gold-bright); font-size:0.8rem; padding:9px 16px; min-height:40px;
    transition:background .2s, color .2s;
  }
  .sync-btn:hover{background:rgba(207,159,63,0.1);}
  .sync-btn.synced{border-color:var(--gold-bright); background:rgba(207,159,63,0.12); color:var(--ivory);}

  /* Day navigator */
  .day-nav-wrap{max-width:900px; margin:22px auto 0; padding:0 24px;}
  .day-nav{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--forest-mid); border:1px solid var(--canopy-line); border-radius:12px;
    padding:10px 14px;
  }
  .day-nav-btn{
    display:flex; align-items:center; gap:6px;
    background:transparent; border:1px solid var(--canopy-line); border-radius:8px;
    color:var(--text-soft); font-size:0.82rem; padding:9px 14px;
    min-height:44px; transition:border-color .2s, color .2s;
  }
  .day-nav-btn svg{width:16px; height:16px;}
  .day-nav-btn:not(:disabled):hover{border-color:var(--gold-bright); color:var(--ivory);}
  .day-nav-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .day-nav-label{
    text-align:center; font-family:'Spectral'; font-style:italic; color:var(--ivory); font-size:0.92rem;
  }
  .day-nav-label span{display:block; font-size:0.68rem; color:var(--text-dim); font-style:normal; margin-top:2px;}

  /* Search */
  .search-wrap{max-width:900px; margin:16px auto 0; padding:0 24px;}
  .search-box{
    width:100%; background:var(--forest-mid); border:1px solid var(--canopy-line);
    border-radius:10px; padding:12px 16px; color:var(--mist); font-family:'LXGW WenKai TC';
    font-size:0.95rem; outline:none; transition:border-color .2s;
  }
  .search-box::placeholder{color:var(--text-dim);}
  .search-box:focus{border-color:var(--gold-bright);}

  .grid-wrap{max-width:1080px; margin:0 auto; padding:26px 24px 20px;}
  .section-label{
    font-family:'Spectral'; font-style:italic; color:var(--text-dim); font-size:0.85rem;
    margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--canopy-line);
  }
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px;
  }

  .flashcard{ perspective:1200px; height:320px; }
  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:14px; border:1px solid var(--canopy-line);
    padding:22px 20px; display:flex; flex-direction:column;
  }
  .card-front{
    background:linear-gradient(155deg, var(--forest-mid), var(--canopy));
    justify-content:space-between;
  }
  .card-front .names{flex:1; display:flex; flex-direction:column; justify-content:center; gap:8px;}
  .card-front .zh{font-family:'Spectral'; font-size:1.7rem; font-weight:700; color:var(--ivory); line-height:1.3;}
  .card-front .en{font-size:1.08rem; color:var(--text-soft); font-weight:600;}
  .card-front .sci{font-size:1rem;}
  .card-actions{display:flex; gap:8px; margin-top:16px;}
  .card-btn{
    flex:1; border:1px solid var(--canopy-line); border-radius:8px; background:rgba(255,255,255,0.02);
    color:var(--text-soft); font-size:0.86rem; padding:10px 6px; text-align:center;
    min-height:44px; display:flex; align-items:center; justify-content:center;
    transition:border-color .2s, background .2s, color .2s;
  }
  .card-btn:hover{border-color:var(--gold-bright); color:var(--ivory);}
  .card-btn.learn-btn.learned{
    background:linear-gradient(120deg, var(--gold), var(--gold-bright));
    color:#241804; border-color:var(--gold-bright); font-weight:600;
  }
  .stamp{
    position:absolute; top:10px; right:10px; width:52px; height:52px; border-radius:50%;
    border:2px solid var(--gold-bright); color:var(--gold-bright);
    display:none; align-items:center; justify-content:center; text-align:center;
    font-size:0.68rem; line-height:1.2; letter-spacing:0.02em; transform:rotate(8deg);
    background:rgba(207,159,63,0.08);
  }
  .flashcard.learned .stamp{display:flex;}

  .card-back{ background:var(--forest-mid); justify-content:space-between; transform:rotateY(180deg); }
  .card-back .zh-b{font-family:'Spectral'; font-size:1.35rem; font-weight:700; color:var(--ivory);}
  .card-back .en-b{font-size:0.98rem; color:var(--text-soft); margin-top:4px;}
  .card-back .sci-b{font-size:1rem; margin-top:4px; display:block;}
  .card-back .meta{font-size:0.86rem; color:var(--text-dim); margin-top:14px; line-height:1.7;}
  .ebird-link{
    display:flex; align-items:center; gap:6px; justify-content:center;
    font-size:0.86rem; color:var(--gold-bright); text-decoration:none;
    border:1px solid var(--canopy-line); border-radius:8px; padding:10px 10px;
    transition:border-color .2s, background .2s; min-height:44px;
  }
  .ebird-link:hover{border-color:var(--gold-bright); background:rgba(207,159,63,0.08);}

  .no-results{ text-align:center; color:var(--text-dim); padding:30px 0; font-size:0.9rem; }

  .locked-block{max-width:1080px; margin:8px auto 0; padding:0 24px 40px;}
  .locked-card{
    display:flex; align-items:center; gap:16px;
    background:rgba(255,255,255,0.02); border:1px dashed var(--canopy-line); border-radius:12px;
    padding:18px 22px; color:var(--text-dim); font-size:0.84rem;
  }
  .locked-card svg{width:24px; height:24px; flex-shrink:0; color:var(--lock-gray);}

  footer{
    text-align:center; color:var(--text-dim); font-size:0.78rem;
    padding:20px 24px 50px; border-top:1px solid var(--canopy-line);
  }
  footer .latin{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){ .flashcard-inner{transition:none;} }
  @media (max-width:520px){
    .day-nav{flex-wrap:wrap;}
    .day-nav-label{order:-1; flex-basis:100%;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <span class="eyebrow">Thailand · Khao Yai National Park</span>
    <h1 class="title">考艾鳥類全名錄<small>231 Species · 2026年4/1–7/26</small></h1>
    <p class="subtitle">整座考艾就是一個大教室——每天認識 6 種鳥，可以用上一頁 / 下一頁回顧任何一天學過的鳥種。</p>
  </div>
  <svg class="ridge" viewBox="0 0 1440 180" preserveAspectRatio="none">
    <polygon points="0,180 0,120 220,80 480,125 760,50 1020,110 1260,70 1440,100 1440,180" fill="#152b1e" opacity="0.9"/>
    <polygon points="0,180 0,140 260,100 560,145 860,90 1140,135 1440,110 1440,180" fill="#0c1c14"/>
  </svg>
</div>

<div class="dash-wrap">

</div>

<div class="day-nav-wrap">

      前一天

    <div class="day-nav-label" id="day-nav-label"></div>
    <button class="day-nav-btn" id="next-day-btn">

</div>

<div class="search-wrap">
  <input type="text" class="search-box" id="search-box" placeholder="搜尋鳥名（中文、英文或學名）— 搜尋會顯示所有已解鎖範圍內符合的鳥種">
</div>

<div class="grid-wrap">
  <div class="section-label" id="unlocked-label"></div>
  <div class="card-grid" id="card-grid"></div>
  <div class="no-results" id="no-results" style="display:none;">沒有符合的鳥種</div>
</div>

<div class="locked-block" id="locked-block"></div>

<footer>
  野島方舟 <span class="latin">Wildisle Ark</span> · 學習進度會自動儲存在此裝置的瀏覽器中
</footer>

function daysBetween(a, b){
  const da = new Date(a+'T00:00:00');
  const db = new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}
function loadState(){
  let s;
  try{ s = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ s = null; }
  if(!s || !s.startDate){
    s = { startDate: todayStr(), learned: {} };
    saveState(s);
  }
  return s;
}
function saveState(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}

/* ===== Google Drive sync (appDataFolder) ===== */
const GOOGLE_CLIENT_ID = '106856186819-8885pr20o9l5crrako6as8kn43tvd24q.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILENAME = 'khaoyai-progress.json';
let accessToken = null;
let driveFileId = null;
let tokenClient = null;

function setSyncStatus(text){
  const el = document.getElementById('sync-status');
  if(el) el.textContent = text;
}

function mergeState(local, cloud){
  // union of learned flags; keep the earliest startDate so unlock progress never regresses
  const merged = { startDate: local.startDate, learned: {} };
  if(cloud.startDate && cloud.startDate < merged.startDate) merged.startDate = cloud.startDate;
  const allKeys = new Set([...Object.keys(local.learned||{}), ...Object.keys(cloud.learned||{})]);
  allKeys.forEach(k=>{
    merged.learned[k] = !!(local.learned && local.learned[k]) || !!(cloud.learned && cloud.learned[k]);
  });
  return merged;
}

async function driveFindFile(){
  const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=' + encodeURIComponent(`name='${DRIVE_FILENAME}'`), {
    headers: { Authorization: 'Bearer ' + accessToken }
  });
  if(!res.ok) throw new Error('find failed: ' + res.status);
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function driveReadFile(fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + accessToken }
  });
  if(!res.ok) throw new Error('read failed: ' + res.status);
  return res.json();
}

async function driveCreateFile(content){
  const metadata = { name: DRIVE_FILENAME, parents: ['appDataFolder'] };
  const boundary = '-------khaoyaiboundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(content)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok) throw new Error('create failed: ' + res.status);
  const data = await res.json();
  return data.id;
}

async function driveUpdateFile(fileId, content){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(content)
  });
  if(!res.ok) throw new Error('update failed: ' + res.status);
}

async function pushStateToDrive(){
  if(!accessToken) return;
  try{
    if(driveFileId){
      await driveUpdateFile(driveFileId, state);
    } else {
      driveFileId = await driveCreateFile(state);
    }
    setSyncStatus('已同步到 Google 帳號 · ' + new Date().toLocaleTimeString('zh-TW'));
  }catch(e){
    setSyncStatus('同步失敗，稍後會再嘗試');
  }
}

async function onSignedIn(){
  setSyncStatus('登入成功，讀取雲端進度中…');
  try{
    const existing = await driveFindFile();
    if(existing){
      driveFileId = existing.id;
      const cloudState = await driveReadFile(existing.id);
      state = mergeState(state, cloudState || {startDate: state.startDate, learned:{}});
      saveState(state);
      await driveUpdateFile(driveFileId, state);
    } else {
      driveFileId = await driveCreateFile(state);
    }
    setSyncStatus('已登入並同步（此裝置與雲端進度已合併）');
    document.getElementById('sync-btn').textContent = '重新同步';
    document.getElementById('sync-btn').classList.add('synced');
    renderDash();
    if(searchBox.value.trim()) renderSearch(searchBox.value.trim());
    else renderDayView();
  }catch(e){
    setSyncStatus('讀取雲端進度失敗：' + e.message);
  }
}

function initGoogleSync(){
  if(typeof google === 'undefined' || !google.accounts){
    setSyncStatus('Google 登入功能載入失敗，請檢查網路連線');
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ setSyncStatus('登入失敗：' + resp.error); return; }
      accessToken = resp.access_token;
      onSignedIn();
    }
  });
  document.getElementById('sync-btn').addEventListener('click', ()=>{
    setSyncStatus('正在開啟 Google 登入視窗…');
    tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
  });
}


let state = loadState();
const dayIndex = Math.max(0, daysBetween(state.startDate, todayStr()));
const currentDay = dayIndex + 1;
const totalDays = Math.ceil(TOTAL / DAILY_RATE);
const clampedCurrentDay = Math.min(currentDay, totalDays);
const unlockedCount = Math.min(TOTAL, clampedCurrentDay * DAILY_RATE);

let viewingDay = clampedCurrentDay;

function renderDash(){
  const learnedCount = Object.values(state.learned).filter(Boolean).length;
  const dash = document.getElementById('dash');
  dash.innerHTML = `
    <div class="dash-item"><div class="dash-num">${clampedCurrentDay}</div><div class="dash-label">學習第幾天</div></div>
    <div class="dash-item"><div class="dash-num">${unlockedCount}</div><div class="dash-label">已解鎖 / ${TOTAL}</div></div>
    <div class="dash-item"><div class="dash-num">${learnedCount}</div><div class="dash-label">已認識 / ${TOTAL}</div></div>
    <div class="progress-track"><div class="progress-fill" style="width:${(unlockedCount/TOTAL*100).toFixed(1)}%"></div></div>
    <div class="unlock-note">${unlockedCount>=TOTAL ? '全部 '+TOTAL+' 種都已解鎖，名錄完整制霸' : `每天解鎖 <b>${DAILY_RATE}</b> 種，明天 00:00 後再解鎖下一批`}</div>
  `;
}

function birdKey(zh){ return zh; }
function matchesSearch(sp, q){
  if(!q) return true;
  q = q.toLowerCase();
  return sp.zh.includes(q) || (sp.en && sp.en.toLowerCase().includes(q)) || (sp.latin && sp.latin.toLowerCase().includes(q));
}

function cardHTML(sp, isNewToday){
  const key = birdKey(sp.zh);
  const learned = !!state.learned[key];
  return `
    <div class="flashcard ${learned?'learned':''}" data-key="${key}">
      <div class="flashcard-inner">
        <div class="card-face card-front">
          <div class="stamp">已<br>認識</div>
          <div class="names">
            <div class="zh">${sp.zh}</div>
            <div class="en">${sp.en}</div>
            <div class="sci latin">${sp.latin}</div>
          </div>
          <div class="card-actions">
            <button class="card-btn flip-btn">翻面看筆記 →</button>
            <button class="card-btn learn-btn ${learned?'learned':''}">${learned?'✓ 已認識':'我認識了'}</button>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="zh-b">${sp.zh}</div>
            <div class="en-b">${sp.en}</div>
            <span class="sci-b latin">${sp.latin}</span>
            <div class="meta">最近記錄：${sp.date}<br>地點：${sp.loc}<br>回報人：${sp.observer}</div>
          </div>
          <div class="card-actions">
            <button class="card-btn flip-btn">← 翻回正面</button>
            <a class="ebird-link" style="flex:1;" href="${sp.url}" target="_blank" rel="noopener noreferrer">${EXTERNAL_ICON} 查看資訊與照片</a>
          </div>
        </div>
      </div>
    </div>
  `;
}

function attachCardEvents(container){
  container.querySelectorAll('.flashcard').forEach(card=>{
    const key = card.dataset.key;
    card.querySelectorAll('.flip-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> card.classList.toggle('flipped'));
    });
    const learnBtn = card.querySelector('.learn-btn');
    learnBtn.addEventListener('click', ()=>{
      const nowLearned = !state.learned[key];
      state.learned[key] = nowLearned;
      saveState(state);
      card.classList.toggle('learned', nowLearned);
      learnBtn.classList.toggle('learned', nowLearned);
      learnBtn.textContent = nowLearned ? '✓ 已認識' : '我認識了';
      renderDash();
      pushStateToDrive();
    });
  });
}

function renderDayView(){
  document.getElementById('day-nav-wrap-placeholder');
  const start = (viewingDay-1)*DAILY_RATE;
  const daySpecies = SPECIES.slice(start, start+DAILY_RATE);
  const grid = document.getElementById('card-grid');
  const label = document.getElementById('unlocked-label');
  const noResults = document.getElementById('no-results');
  noResults.style.display = 'none';

  label.textContent = viewingDay === clampedCurrentDay ? `今日 ${DAILY_RATE} 鳥（第 ${viewingDay} 天）`
    : viewingDay > clampedCurrentDay ? `第 ${viewingDay} 天（提前預覽，尚未正式解鎖）`
    : `第 ${viewingDay} 天回顧`;
  grid.innerHTML = daySpecies.map(sp => cardHTML(sp, false)).join('');
  attachCardEvents(grid);

  document.getElementById('day-nav-label').innerHTML = `第 ${viewingDay} / ${totalDays} 天<span>第 ${start+1}–${start+daySpecies.length} 種</span>`;
  document.getElementById('prev-day-btn').disabled = viewingDay <= 1;
  document.getElementById('next-day-btn').disabled = viewingDay >= totalDays;
}

function renderSearch(query){
  const grid = document.getElementById('card-grid');
  const label = document.getElementById('unlocked-label');
  const noResults = document.getElementById('no-results');
  const unlocked = SPECIES.slice(0, unlockedCount);
  const filtered = unlocked.filter(sp => matchesSearch(sp, query));
  label.textContent = `搜尋結果（${filtered.length} 筆，僅限已解鎖範圍）`;
  if(filtered.length === 0){
    grid.innerHTML = '';
    noResults.style.display = '';
    return;
  }
  noResults.style.display = 'none';
  grid.innerHTML = filtered.map(sp => cardHTML(sp, false)).join('');
  attachCardEvents(grid);
}

function renderLocked(){
  const remaining = TOTAL - unlockedCount;
  const block = document.getElementById('locked-block');
  if(remaining <= 0){ block.innerHTML=''; return; }
  const daysLeft = Math.ceil(remaining / DAILY_RATE);
  block.innerHTML = `
    <div class="locked-card">
      ${LOCK_ICON}
      <div>還有 <b style="color:var(--gold-bright)">${remaining}</b> 種尚未解鎖，依每天 ${DAILY_RATE} 種的速度，約 ${daysLeft} 天後可以學完整份名錄。</div>
    </div>
  `;
}

const searchBox = document.getElementById('search-box');
const dayNavWrap = document.querySelector('.day-nav-wrap');

searchBox.addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  if(q){
    dayNavWrap.style.display = 'none';
    renderSearch(q);
  } else {
    dayNavWrap.style.display = '';
    renderDayView();
  }
});

document.getElementById('prev-day-btn').addEventListener('click', ()=>{
  if(viewingDay > 1){ viewingDay--; renderDayView(); }
});
document.getElementById('next-day-btn').addEventListener('click', ()=>{
  if(viewingDay < totalDays){ viewingDay++; renderDayView(); }
});

renderDash();
renderDayView();
renderLocked();
window.addEventListener('load', initGoogleSync);
</script>
